<title>Tandem demo</title>

:root {

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: 'InterV', system-ui, sans-serif; color: var(--ink); font-feature-settings: 'cv11', 'ss01'; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
svg.i { display: inline-block; flex-shrink: 0; }

/* background */
.blob { position: absolute; border-radius: 50%; filter: blur(10px); }
#skyline { position: absolute; left: 1380px; bottom: 0; opacity: .55; }

#topbar { position: absolute; left: 64px; top: 34px; right: 64px; height: 60px; display: flex; align-items: center; }
#brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; }
#pills { margin-left: auto; display: flex; gap: 8px; }
.pill { height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 600; border: 1.5px solid var(--line); background: #fff; color: var(--muted); white-space: nowrap; }
.pill .n { font-variant-numeric: tabular-nums; opacity: .7; }

/* browser */
#browser { position: absolute; left: 64px; top: 128px; width: 1328px; height: 876px; border-radius: 18px; background: #fff; box-shadow: 0 1px 2px rgb(16 24 40 / .06), 0 30px 70px -30px rgb(16 24 40 / .35), 0 0 0 1px rgb(16 24 40 / .06); overflow: hidden; }
#chrome { position: absolute; left: 0; top: 0; right: 0; height: 46px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 18px; gap: 8px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line-strong); }
#url { margin-left: 18px; height: 30px; min-width: 520px; padding: 0 14px; border-radius: 999px; background: var(--mist); display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
#url b { color: var(--ink-soft); font-weight: 500; }
#vp { position: absolute; left: 0; top: 46px; width: 1328px; height: 830px; overflow: hidden; background: var(--paper); }
#cam { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; }
.shot { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; overflow: hidden; transform-origin: 0 0; background: var(--paper); }
.page { position: absolute; left: 0; top: 0; width: 1280px; }
.page > img { display: block; width: 1280px; }
.patch { position: absolute; left: 0; top: 0; width: 1280px; background-repeat: no-repeat; }
.hdr { position: absolute; left: 0; top: 0; width: 1280px; background-repeat: no-repeat; box-shadow: 0 6px 16px -10px rgb(16 24 40 / .35); }
.typing { position: absolute; background: #fff; display: flex; align-items: center; font-size: 16px; color: var(--ink); white-space: pre; overflow: hidden; }
.caret { display: inline-block; width: 2px; height: 20px; background: var(--ink); margin-left: 1px; }
#ov { position: absolute; left: 0; top: 0; width: 1328px; height: 830px; pointer-events: none; }
.ring { position: absolute; border: 3px solid var(--brand); border-radius: 14px; box-shadow: 0 0 0 6px rgb(200 16 46 / .16), 0 10px 30px -8px rgb(200 16 46 / .35); }
.rlabel { position: absolute; background: var(--brand); color: #fff; font-size: 18px; font-weight: 650; padding: 8px 15px; border-radius: 999px; white-space: nowrap; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 24px -10px rgb(155 16 38 / .7); }
#cursor { position: absolute; left: 0; top: 0; width: 30px; height: 30px; filter: drop-shadow(0 3px 4px rgb(0 0 0 / .3)); }
.ripple { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 3px solid var(--brand); background: rgb(200 16 46 / .12); }
.mode { position: absolute; left: 50%; bottom: 34px; height: 54px; padding: 0 24px 0 18px; border-radius: 999px; background: var(--ink); color: #fff; display: flex; align-items: center; gap: 11px; font-size: 21px; font-weight: 600; white-space: nowrap; box-shadow: 0 16px 40px -12px rgb(0 0 0 / .45); }
.mode svg { color: #ffb3c0; }
#waves { position: absolute; width: 60px; height: 60px; }

.chip.aud { background: var(--tint); border-color: var(--soft); color: var(--brand-deep); }
.chip.sm { font-size: 15px; padding: 7px 12px 7px 10px; gap: 7px; }
#persona { position: absolute; left: 0; bottom: 0; width: 408px; padding: 18px 20px; border-radius: 20px; background: #fff; border: 1.5px solid var(--line); box-shadow: 0 12px 32px -14px rgb(16 24 40 / .28); }

#persona .av { width: 52px; height: 52px; border-radius: 50%; background: #b8285c; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 19px; }

#persona .ds { font-size: 16px; color: var(--muted); margin-top: 2px; }

#persona .tag svg { color: var(--brand); }

  { from: 37.7, to: 38.45, icon: 'contrast', text: 'High contrast' },
]

const STEPS = [
  { label: 'Sign up', from: 0, to: 10.6 }, { label: 'Filter', from: 10.6, to: 16.95 }, { label: 'Map', from: 16.95, to: 21.35 },
  { label: 'Join', from: 21.35, to: 27.45 }, { label: 'Chat', from: 27.45, to: 31.95 }, { label: 'Rate', from: 31.95, to: 34.5 },
  { label: 'Accessibility', from: 34.5, to: 99 },
]

const PANELS = [
  { from: 0.18, to: 3.55, title: 'Sign up in seconds', sub: 'Google or email', chips: [['shield-check', 'Google Identity Services'], ['lock', 'No passwords stored']] },
  { from: 3.58, to: 5.95, title: 'Pick your interests', sub: 'Books, coffee, hikes, meetups', chips: [['sparkles', 'Explained recommendations']] },
  { from: 6.0, to: 10.58, title: 'Comfort & Access', sub: 'Practical needs, private by default', chips: [['lock', 'Never medical labels'], ['heart-handshake', 'Ease Into It re-ranks events']] },
  { from: 10.63, to: 16.93, title: 'Search like you talk', sub: 'Plus accessibility filters', chips: [['sparkles', 'Plain language → filters'], ['mic', 'Voice search · Web Speech API'], ['sliders-horizontal', 'Filters shared by list & map']] },
  { from: 16.98, to: 21.33, title: 'Explore the map', sub: 'Every event across Calgary', chips: [['map', 'Leaflet + OpenStreetMap'], ['layers', 'Zoom-aware clustering'], ['map-pin', 'Private spots shown as areas']] },
  { from: 21.38, to: 27.43, title: 'Know before you go', sub: 'Tags, what to expect, access', chips: [['badge-check', 'Organizer-confirmed access info'], ['calendar-check', 'Join · calendar · Tandem Miles']] },
  { from: 27.48, to: 31.93, title: 'Say hi before you arrive', sub: 'Live group chat', chips: [['radio', 'Tandem Live · Node.js + SSE'], ['container', 'Runs in Docker'], ['wifi-off', 'Falls back to offline mode']] },
  { from: 31.98, to: 34.48, title: 'Rate the event', sub: 'Events are rated. People never are.', chips: [['trophy', 'Fair (Bayesian) leaderboard'], ['users', 'One rating per attendee']] },
  { from: 34.53, to: 99, eyebrow: 'The bigger picture', title: 'Adapts to every Calgarian', sub: 'All ages, abilities and comfort levels',
    aud: [['plane', 'Visitors & newcomers'], ['heart-handshake', 'Social anxiety'], ['users', 'Seniors'], ['eye', 'Low vision'], ['audio-lines', 'Screen readers'], ['accessibility', 'Wheelchair users'], ['ear', 'Sensory needs']],
    stack: [['code-xml', 'React 19 + TypeScript'], ['zap', 'Vite · Tailwind CSS v4'], ['map', 'Leaflet · OpenStreetMap'], ['radio', 'Tandem Live (Node SSE)'], ['container', 'Docker'], ['database', 'Supabase · Postgres RLS'], ['shield-check', 'Google Identity'], ['mic', 'Web Speech API'], ['badge-check', 'Vitest · axe WCAG 2.2 AA']], stackAt: 38.2 },
]

/* Pacing: the timeline above is authored on a 40 s base and stretched by K. Event times scale; animation
   lengths (fades, reveals, ripples, panel entrances) stay fixed so motion stays crisp while holds get longer. */
const K = 60 / 40
for (const s of SHOTS) {
  s.in *= K
  s.scroll = s.scroll.map(([t, y]) => [t * K, y])
  if (s.xf) s.xf = s.xf.map(([t, ...v]) => [t * K, ...v])
  for (const p of s.patches ?? []) p.at *= K
  if (s.typing) { s.typing.from *= K; s.typing.to *= K; s.typing.caret = s.typing.caret.map((x) => x * K) }
}
CAM.forEach((c) => { c[0] *= K })
RINGS.forEach((r) => { r.from *= K; r.to *= K })
CURSOR.forEach((c) => { c.from *= K; c.to *= K; c.kf = c.kf.map(([t, x, y]) => [t * K, x, y]) })
CLICKS.forEach((v, i) => { CLICKS[i] = v * K })
MODES.forEach((m) => { m.from *= K; m.to *= K })
STEPS.forEach((st) => { st.from *= K; st.to *= K })
PANELS.forEach((p) => { p.from *= K; p.to *= K; if (p.stackAt) p.stackAt *= K })

/* ============================================================== build DOM */
const $ = (id) => document.getElementById(id)
$('logo').innerHTML = LOGO.replace('<svg ', '<svg width="64" height="40" ')
$('ptags').innerHTML = [['heart-handshake', 'Social anxiety'], ['ear', 'Prefers quiet, small groups']].map(([i, t]) => `<span class="tag">${icon(i, 15, 2.2)}${t}</span>`).join('')

const pillEls = STEPS.map((s, i) => { const p = el('div', 'pill', `<span class="ck"></span>${s.label}`); $('pills').appendChild(p); return p })

const cam = $('cam'), ov = $('ov')
const shotById = {}
const images = new Set()
for (const s of SHOTS) {
  const h = H(s.img)
  s.h = h
  s.el = el('div', 'shot')
  s.page = el('div', 'page')
  s.page.style.height = h + 'px'
  const img = el('img'); img.src = `shots/${s.img}.png`; img.style.height = h + 'px'
  images.add(img)
  s.page.appendChild(img)
  for (const p of s.patches ?? []) {
    p.el = el('div', 'patch')
    p.el.style.height = h + 'px'
    p.el.style.backgroundImage = `url(shots/${p.img}.png)`
    p.el.style.backgroundSize = `1280px ${H(p.img)}px`
    s.page.appendChild(p.el)
    const pre = new Image(); pre.src = `shots/${p.img}.png`; images.add(pre)
  }
  if (s.typing) {
    const ty = s.typing
    ty.el = el('div', 'typing')
    Object.assign(ty.el.style, { left: ty.rect[0] + 'px', top: ty.rect[1] + 'px', width: ty.rect[2] + 'px', height: ty.rect[3] + 'px', paddingLeft: (ty.x - ty.rect[0]) + 'px', fontSize: ty.size + 'px' })
    ty.txt = el('span'); ty.car = el('span', 'caret')
    ty.el.append(ty.txt, ty.car)
    s.page.appendChild(ty.el)
  }
  s.el.appendChild(s.page)
  const hh = SHOT_META[s.img].headerH || 65
  if (h > VH) {
    s.hdr = el('div', 'hdr')
    Object.assign(s.hdr.style, { height: hh + 'px', backgroundImage: `url(shots/${s.img}.png)`, backgroundSize: `1280px ${h}px` })
    s.el.appendChild(s.hdr)
  }
  cam.appendChild(s.el)
  shotById[s.id] = s
}
SHOTS.forEach((s, i) => { s.out = i + 1 < SHOTS.length ? SHOTS[i + 1].in + SHOTS[i + 1].fd + 0.02 : 99 })

for (const r of RINGS) {
  r.el = el('div', 'ring'); r.lab = el('div', 'rlabel', `${icon(r.icon, 19, 2.4)}<span>${r.label}</span>`)
  ov.append(r.el, r.lab)
}
const ripples = CLICKS.map(() => { const e = el('div', 'ripple'); ov.appendChild(e); return e })
const cursor = el('div', null, `<svg id="cursor-svg" width="30" height="30" viewBox="0 0 30 30"><path d="M6 3.5 L6 23.5 L11.2 18.6 L14.9 26.6 L18.6 25 L15 17.2 L21.8 17.2 Z" fill="#202124" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`)
cursor.id = 'cursor'
ov.appendChild(cursor)
for (const m of MODES) { m.el = el('div', 'mode', `${icon(m.icon, 24, 2.2)}<span>${m.text}</span>`); ov.appendChild(m.el) }
const waves = el('div', null, `<svg width="60" height="60" viewBox="0 0 60 60" fill="none" stroke="#c8102e" stroke-width="3.2" stroke-linecap="round"><path class="w1" d="M14 22 Q20 30 14 38"/><path class="w2" d="M22 16 Q32 30 22 44"/><path class="w3" d="M30 10 Q44 30 30 50"/></svg>`)
waves.id = 'waves'; ov.appendChild(waves)
const wavePaths = [...waves.querySelectorAll('path')]

const panel = $('panel')
for (const p of PANELS) {
  p.el = el('div', 'pb')
  let html = p.eyebrow ? `<div class="eyebrow">${p.eyebrow}</div>` : ''
  html += `<h2>${p.title}</h2><p class="sub">${p.sub}</p>`
  if (p.chips) html += `<div class="th">Under the hood</div><div class="chips">${p.chips.map(([i, t]) => `<span class="chip">${icon(i, 20, 2.2)}${t}</span>`).join('')}</div>`
  if (p.aud) html += `<div class="th">Designed for</div><div class="chips wrap aud-wrap">${p.aud.map(([i, t]) => `<span class="chip aud sm">${icon(i, 17, 2.2)}${t}</span>`).join('')}</div>`
  if (p.stack) html += `<div class="th stack-h">Built with</div><div class="chips wrap stack-wrap">${p.stack.map(([i, t]) => `<span class="chip sm">${icon(i, 17, 2.2)}${t}</span>`).join('')}</div>`
  p.el.innerHTML = html
  p.chipEls = [...p.el.querySelectorAll('.chips:not(.aud-wrap):not(.stack-wrap) .chip')]
  p.audEls = [...p.el.querySelectorAll('.aud-wrap .chip')]
  p.stackEls = [...p.el.querySelectorAll('.stack-wrap .chip')]
  p.stackHead = p.el.querySelector('.stack-h')
  panel.appendChild(p.el)
}

/* ============================================================== per-frame state */
function scrollOf(s, t) { return track(s.scroll.length > 1 ? s.scroll : [[0, s.scroll[0][1]]], t) }
function camAt(t) {
  let [z, cx, cy] = track(CAM.map(([tt, ...v]) => [tt, v]), t)
  const hx = VW / (2 * z), hy = VH / (2 * z)
  cx = Math.max(hx, Math.min(VW - hx, cx)); cy = Math.max(hy, Math.min(VH - hy, cy))
  return { z, cx, cy }
}
const toScreen = (c, vx, vy) => [(vx - c.cx) * c.z * S + (VW * S) / 2, (vy - c.cy) * c.z * S + (VH * S) / 2]

function placeLabel(lab, rx, ry, rw, rh, pos) {
  const w = lab.offsetWidth, h = lab.offsetHeight, g = 14
  let x, y
  if (pos === 'top') { x = rx + rw / 2 - w / 2; y = ry - g - h }
  else if (pos === 'bottom') { x = rx + rw / 2 - w / 2; y = ry + rh + g }
  else if (pos === 'left') { x = rx - g - w; y = ry + rh / 2 - h / 2 }
  else { x = rx + rw + g; y = ry + rh / 2 - h / 2 }
  x = Math.max(12, Math.min(VW * S - w - 12, x)); y = Math.max(12, Math.min(VH * S - h - 12, y))
  return [x, y]
}

function seek(t) {
  /* chrome */
  $('topbar').style.opacity = ease(ramp(t, 0.02, 0.4))
  const b = easeOut(ramp(t, 0, 0.45))
  $('browser').style.opacity = b
  $('browser').style.transform = `translateY(${lerp(30, 0, b)}px) scale(${lerp(0.985, 1, b)})`
  const pe = easeOut(ramp(t, 0.3, 0.7))
  $('persona').style.opacity = pe
  $('persona').style.transform = `translateY(${lerp(18, 0, pe)}px)`

  /* step pills */
  STEPS.forEach((s, i) => {
    const p = pillEls[i]
    const active = t >= s.from && t < s.to
    const done = t >= s.to
    const k = ease(ramp(t, s.from, s.from + 0.25))
    if (active) { p.style.background = `rgb(${lerp(255, 200, k)} ${lerp(255, 16, k)} ${lerp(255, 46, k)})`; p.style.color = k > 0.5 ? '#fff' : 'var(--muted)'; p.style.borderColor = 'transparent'; p.style.transform = `scale(${lerp(1, 1.06, k)})` }
    else if (done) { p.style.background = 'var(--tint)'; p.style.color = 'var(--brand-deep)'; p.style.borderColor = 'var(--soft)'; p.style.transform = 'scale(1)' }
    else { p.style.background = '#fff'; p.style.color = 'var(--muted)'; p.style.borderColor = 'var(--line)'; p.style.transform = 'scale(1)' }
    p.firstChild.innerHTML = done ? icon('check', 16, 3) : ''
  })

  /* camera + shots */
  const c = camAt(t)
  cam.style.transform = `translate(${(VW * S) / 2 - c.cx * c.z * S}px, ${(VH * S) / 2 - c.cy * c.z * S}px) scale(${c.z * S})`
  let top = null
  for (const s of SHOTS) {
    const visible = t >= s.in && t < s.out
    s.el.style.display = visible ? 'block' : 'none'
    if (!visible) continue
    top = s
    s.el.style.opacity = s.fd ? ease(ramp(t, s.in, s.in + s.fd)) : 1
    if (s.xf) {
      const [sc, ox, oy] = track(s.xf.map(([tt, ...v]) => [tt, v]), t)
      s.el.style.transform = `translate(${ox}px, ${oy}px) scale(${sc}) translate(${-ox}px, ${-oy}px)`
    }
    const y = scrollOf(s, t)
    s.page.style.transform = `translateY(${-y}px)`
    if (s.hdr) s.hdr.style.display = y > 1 ? 'block' : 'none'
    for (const p of s.patches ?? []) {
      const k = ramp(t, p.at, p.at + p.dur)
      if (k <= 0) { p.el.style.display = 'none'; continue }
      p.el.style.display = 'block'
      if (p.kind === 'circle') {
        p.el.style.clipPath = `circle(${p.r * backOut(k)}px at ${p.c[0]}px ${p.c[1]}px)`
        p.el.style.opacity = 1
      } else {
        const [x, yy, w, hh] = p.rect
        const ww = p.kind === 'wipe' ? w * ease(k) : w
        p.el.style.clipPath = `inset(${yy}px ${1280 - x - ww}px ${s.h - yy - hh}px ${x}px round 8px)`
        p.el.style.opacity = p.kind === 'wipe' ? 1 : ease(k)
        if (p.kind === 'pop') {
          const e = backOut(k)
          p.el.style.transformOrigin = `${p.origin[0]}px ${p.origin[1]}px`
          p.el.style.transform = `scale(${lerp(0.82, 1, e)})`
        }
      }
    }
    if (s.typing) {
      const ty = s.typing
      const on = t >= ty.caret[0] && t < ty.caret[1]
      ty.el.style.display = on ? 'flex' : 'none'
      const n = Math.round(ty.text.length * ramp(t, ty.from, ty.to))
      ty.txt.textContent = ty.text.slice(0, n)
      ty.car.style.opacity = (t < ty.to ? 1 : Math.floor(t * 3.2) % 2 === 0 ? 1 : 0)
    }
  }
  if (top) $('url').innerHTML = `${icon('globe', 15, 2)}<span>localhost:5173<b>${top.url}</b></span>`

  /* rings */
  for (const r of RINGS) {
    const s = shotById[r.shot]
    const vis = t >= r.from && t < r.to && t >= s.in && t < s.out
    r.el.style.display = r.lab.style.display = vis ? 'block' : 'none'
    if (!vis) continue
    r.lab.style.display = 'flex'
    const k = easeOut(ramp(t, r.from, r.from + 0.2)) * (1 - ease(ramp(t, r.to - 0.16, r.to)))
    const y = scrollOf(s, t)
    const pad = 7
    const [x0, y0] = toScreen(c, r.rect[0] - pad, r.rect[1] - y - pad)
    const [x1, y1] = toScreen(c, r.rect[0] + r.rect[2] + pad, r.rect[1] + r.rect[3] - y + pad)
    const grow = lerp(1.08, 1, easeOut(ramp(t, r.from, r.from + 0.25)))
    Object.assign(r.el.style, { left: x0 + 'px', top: y0 + 'px', width: (x1 - x0) + 'px', height: (y1 - y0) + 'px', opacity: k, transform: `scale(${grow})` })
    const [lx, ly] = placeLabel(r.lab, x0, y0, x1 - x0, y1 - y0, r.pos)
    Object.assign(r.lab.style, { left: lx + 'px', top: ly + 'px', opacity: k, transform: `translateY(${lerp(8, 0, easeOut(ramp(t, r.from + 0.05, r.from + 0.3)))}px)` })
  }

  /* cursor */
  let cpos = null, cop = 0
  for (const seg of CURSOR) {
    if (t < seg.from || t > seg.to) continue
    const s = shotById[seg.shot]
    const kv = seg.kf.map(([tt, x, yy]) => [tt, [x, yy - scrollOf(s, tt)]])
    const [vx, vy] = track(kv, t)
    cpos = toScreen(c, vx, vy)
    cop = ramp(t, seg.from, seg.from + 0.15) * (1 - ramp(t, seg.to - 0.15, seg.to))
  }
  cursor.style.display = cpos ? 'block' : 'none'
  if (cpos) {
    const press = CLICKS.some((ct) => t >= ct - 0.05 && t < ct + 0.1) ? 0.86 : 1
    cursor.style.opacity = cop
    cursor.style.transform = `translate(${cpos[0] - 6}px, ${cpos[1] - 3.5}px) scale(${press})`
  }
  CLICKS.forEach((ct, i) => {
    const k = ramp(t, ct, ct + 0.45)
    const e = ripples[i]
    if (k <= 0 || k >= 1 || !cpos) { e.style.display = 'none'; return }
    e.style.display = 'block'
    e.style.left = cpos[0] + 'px'; e.style.top = cpos[1] + 'px'
    e.style.opacity = 0.9 * (1 - k)
    e.style.transform = `scale(${lerp(0.2, 1, easeOut(k))})`
  })

  /* display-mode toast */
  for (const m of MODES) {
    const vis = t >= m.from && t < m.to
    m.el.style.display = vis ? 'flex' : 'none'
    if (!vis) continue
    const k = easeOut(ramp(t, m.from, m.from + 0.22)) * (1 - ease(ramp(t, m.to - 0.15, m.to)))
    m.el.style.opacity = k
    m.el.style.transform = `translateX(-50%) translateY(${lerp(16, 0, k)}px)`
  }

  /* read-aloud waves */
  const ra = RINGS[RINGS.length - 1]
  const wv = t >= ra.from + 0.1
  waves.style.display = wv ? 'block' : 'none'
  if (wv) {
    const s = shotById[ra.shot]
    const [wx, wy] = toScreen(c, ra.rect[0] + ra.rect[2] + 4, ra.rect[1] + ra.rect[3] / 2 - scrollOf(s, t))
    waves.style.left = wx + 'px'; waves.style.top = (wy - 30) + 'px'
    waves.style.opacity = ease(ramp(t, ra.from + 0.1, ra.from + 0.35))
    wavePaths.forEach((p, i) => { p.style.opacity = 0.2 + 0.8 * Math.max(0, Math.sin((t * 2.6 - i * 0.22) * Math.PI)) })
  }

  /* side panel */
  for (const p of PANELS) {
    const vis = t >= p.from - 0.01 && t < p.to
    p.el.style.display = vis ? 'block' : 'none'
    if (!vis) continue
    const kin = easeOut(ramp(t, p.from, p.from + 0.38))
    const kout = ease(ramp(t, p.to - 0.22, p.to))
    p.el.style.opacity = kin * (1 - kout)
    p.el.style.transform = `translateY(${lerp(22, 0, kin) - 12 * kout}px)`
    p.chipEls.forEach((ch, i) => { const k = easeOut(ramp(t, p.from + 0.18 + i * 0.08, p.from + 0.45 + i * 0.08)); ch.style.opacity = k; ch.style.transform = `translateX(${lerp(-14, 0, k)}px)` })
    p.audEls.forEach((ch, i) => { const k = backOut(ramp(t, p.from + 0.35 + i * 0.1, p.from + 0.65 + i * 0.1)); ch.style.opacity = clamp01(k); ch.style.transform = `scale(${lerp(0.7, 1, Math.min(k, 1.05))})` })
    if (p.stackHead) p.stackHead.style.opacity = easeOut(ramp(t, p.stackAt - 0.1, p.stackAt + 0.2))
    p.stackEls.forEach((ch, i) => { const k = easeOut(ramp(t, p.stackAt + i * 0.09, p.stackAt + 0.3 + i * 0.09)); ch.style.opacity = k; ch.style.transform = `translateY(${lerp(10, 0, k)}px)` })
  }
}
window.seek = seek
window.DURATION = 40 * K

Promise.all([...images].map((img) => (img.decode ? img.decode().catch(() => {}) : null)).concat([document.fonts.ready])).then(() => {
  seek(0)
  window.READY = true
  if (new URLSearchParams(location.search).has('play')) {
    const t0 = performance.now()
    const loop = () => { const t = ((performance.now() - t0) / 1000) % (window.DURATION + 1); seek(Math.min(t, window.DURATION)); requestAnimationFrame(loop) }
    loop()
  }
  const at = new URLSearchParams(location.search).get('t')
  if (at) seek(Number(at))
})
</script>
</body>
</html>
