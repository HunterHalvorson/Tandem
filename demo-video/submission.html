#proof { position: absolute; left: 0; top: 884px; width: 1920px; display: flex; justify-content: center; gap: 16px; }

<script>
/* ============================================================== helpers */
const S = 1328 / 1280, VW = 1280, VH = 800
const clamp01 = (x) => Math.max(0, Math.min(1, x))
const ramp = (t, a, b) => (b <= a ? (t >= a ? 1 : 0) : clamp01((t - a) / (b - a)))
const lerp = (a, b, k) => a + (b - a) * k
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)
const easeOut = (x) => 1 - Math.pow(1 - x, 3)
const backOut = (x) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
function track(frames, t, fn = ease) {
  if (t <= frames[0][0]) return frames[0][1]
  for (let i = 1; i < frames.length; i++) {
    if (t <= frames[i][0]) {
      const [t0, v0] = frames[i - 1], [t1, v1] = frames[i]
      const k = fn(ramp(t, t0, t1))
      return Array.isArray(v0) ? v0.map((x, j) => lerp(x, v1[j], k)) : lerp(v0, v1, k)
    }
  }
  return frames[frames.length - 1][1]
}
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e }
const icon = (name, size = 20, sw = 2) => `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] ?? ''}</svg>`
const H = (name) => SHOT_META[name].h
const $ = (id) => document.getElementById(id)
const show = (e, on) => { e.style.display = on ? '' : 'none' }
/** Fade + rise for an element entering at t0 (and optionally leaving at t1). */
function enter(e, t, t0, { dur = 0.45, dy = 24, t1 = Infinity, out = 0.4 } = {}) {
  const k = easeOut(ramp(t, t0, t0 + dur)) * (1 - ease(ramp(t, t1, t1 + out)))
  e.style.opacity = k
  e.style.transform = `translateY(${lerp(dy, 0, easeOut(ramp(t, t0, t0 + dur)))}px)`
  return k
}

/* ============================================================== scenes (lengths come from the script) */
const SCRIPT = window.SUBMISSION_SCRIPT
const SC = {}
{ let acc = 0; for (const s of SCRIPT.scenes) { SC[s.id] = { start: acc, dur: s.dur, end: acc + s.dur }; acc += s.dur } }
const at = (id, x) => SC[id].start + x
const DURATION = SC.close.end

/* The sign-up → map and rating / display sections reuse the 60 s cut's timeline (demo.html, 40 s base).
   ANCH maps those old times onto this cut: actions keep their speed, holds stretch to fit the voice-over. */
const seg = (id, pairs) => pairs.map(([o, n]) => [o, at(id, n)])
const ANCH = [
  ...seg('signup', [[0, 0], [0.35, 5.2], [0.95, 6.6], [1.75, 9.3], [2.22, 9.85], [2.36, 10.0], [3.05, 12.0], [3.38, 12.45]]),
  ...seg('comfort', [[3.5, 0], [3.72, 0.3], [3.8, 0.4], [3.99, 0.65], [4.74, 1.85], [4.85, 2.0], [5.3, 2.5], [5.62, 2.85], [5.72, 3.0], [5.85, 3.15], [5.95, 3.3], [6.25, 3.6], [6.3, 3.65], [6.95, 4.6], [7.3, 5.0], [7.34, 5.05], [7.94, 6.2], [8.05, 6.35], [8.95, 8.6], [9.4, 9.2], [9.48, 9.35], [9.57, 9.6], [9.65, 9.7], [10.1, 10.3], [10.55, 14.3]]),
  ...seg('search', [[10.6, 0], [10.9, 0.4], [11.2, 0.85], [11.24, 0.9], [11.26, 0.92], [11.32, 1.0], [12.12, 2.4], [12.3, 4.6], [12.52, 5.0], [12.57, 5.05], [12.62, 5.15], [12.85, 5.6], [13.05, 5.8], [13.9, 8.3], [13.95, 8.4], [14.2, 8.9], [15.3, 12.4], [15.35, 12.5], [15.7, 13.0], [15.75, 13.1], [15.85, 13.2], [16.85, 16.4]]),

function W(t) {
  if (t <= ANCH[0][0]) return ANCH[0][1] + (t - ANCH[0][0])
  for (let i = 1; i < ANCH.length; i++) {
    if (t <= ANCH[i][0]) { const [a0, b0] = ANCH[i - 1], [a1, b1] = ANCH[i]; return b0 + ((t - a0) * (b1 - b0)) / (a1 - a0) }
  }
  const [a, b] = ANCH[ANCH.length - 1]
  return b + (t - a)
}

/* geometry measured once fonts are ready */
let HERO = null
function measure() {
  const hero = $('hero')
  const w = hero.offsetWidth, h = hero.offsetHeight
  HERO = { w, h, x0: 960 - w / 2, y0: 392 - h / 2, x1: 64, y1: 64 - (h * 0.2) / 2 }
  // stack wires: card edge midpoints (cards are absolutely positioned in stage px)
  const box = (id) => { const e = $(id); return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight } }
  const A = box('cA'), B = box('cB'), B2 = box('cB2'), C1 = box('cC1'), C2 = box('cC2')
  const curve = (x0, y0, x1, y1) => { const dx = (x1 - x0) * 0.5; return [[x0, y0], [x0 + dx, y0], [x1 - dx, y1], [x1, y1]] }
  stackWires = [
    { pts: curve(A.x + A.w, A.y + A.h / 2, B.x, B.y + B.h / 2), at: 6.2 },
    { pts: curve(B.x + B.w, B.y + B.h * 0.35, C1.x, C1.y + C1.h / 2), at: 7.6 },
    { pts: curve(B.x + B.w, B.y + B.h * 0.65, C2.x, C2.y + C2.h / 2), at: 10.9 },
    { pts: [[B.x + B.w / 2, B.y + B.h], [B.x + B.w / 2, B.y + B.h + 30], [B2.x + B2.w / 2, B2.y - 30], [B2.x + B2.w / 2, B2.y]], at: 6.4 },
  ]
  const svg = $('stack-wires')
  svg.innerHTML = ''
  for (const wr of stackWires) {
    const [p0, p1, p2, p3] = wr.pts
    wr.el = document.createElementNS('http://www.w3.org/2000/svg', 'path')
    wr.el.setAttribute('d', `M${p0[0]} ${p0[1]} C${p1[0]} ${p1[1]} ${p2[0]} ${p2[1]} ${p3[0]} ${p3[1]}`)
    wr.el.setAttribute('fill', 'none'); wr.el.setAttribute('stroke', '#e8a0ad'); wr.el.setAttribute('stroke-width', '4'); wr.el.setAttribute('stroke-linecap', 'round')
    svg.appendChild(wr.el)
    wr.len = 0
    let prev = p0
    for (let i = 1; i <= 40; i++) { const q = bez(wr.pts, i / 40); wr.len += Math.hypot(q[0] - prev[0], q[1] - prev[1]); prev = q }
    wr.el.setAttribute('stroke-dasharray', `${wr.len} ${wr.len}`)
  }
}
function bez([p0, p1, p2, p3], u) {
  const v = 1 - u
  return [0, 1].map((j) => v * v * v * p0[j] + 3 * v * v * u * p1[j] + 3 * v * u * u * p2[j] + u * u * u * p3[j])
}

/* ============================================================== per-frame state */
function scrollOf(s, t) { return track(s.scroll.length > 1 ? s.scroll : [[0, s.scroll[0][1]]], t) }
function camAt(t) {
  let [z, cx, cy] = track(CAM.map(([tt, ...v]) => [tt, v]), t)
  const hx = VW / (2 * z), hy = VH / (2 * z)
  cx = Math.max(hx, Math.min(VW - hx, cx)); cy = Math.max(hy, Math.min(VH - hy, cy))
  return { z, cx, cy }
}
const toScreen = (c, vx, vy) => [(vx - c.cx) * c.z * S + (VW * S) / 2, (vy - c.cy) * c.z * S + (VH * S) / 2]
function placeLabel(lab, rx, ry, rw, rh, pos, bw = VW * S, bh = VH * S) {
  const w = lab.offsetWidth, h = lab.offsetHeight, g = 14
  let x, y
  if (pos === 'top') { x = rx + rw / 2 - w / 2; y = ry - g - h }
  else if (pos === 'bottom') { x = rx + rw / 2 - w / 2; y = ry + rh + g }
  else if (pos === 'left') { x = rx - g - w; y = ry + rh / 2 - h / 2 }
  else { x = rx + rw + g; y = ry + rh / 2 - h / 2 }
  x = Math.max(12, Math.min(bw - w - 12, x)); y = Math.max(12, Math.min(bh - h - 12, y))
  return [x, y]
}

function seekSlides(t) {
  /* hook: headline, then stats */
  const hookOn = t < at('intro', 0.8)
  show($('s-hook'), hookOn)
  if (hookOn) {
    const out = ease(ramp(t, at('intro', 0), at('intro', 0.6)))
    $('s-hook').style.opacity = 1 - out
    $('s-hook').style.transform = `translateY(${-30 * out}px)`
    hl1.forEach((w, i) => enter(w, t, at('hook', 0.5) + i * 0.07, { dur: 0.45, dy: 26 }))
    hl2.forEach((w, i) => enter(w, t, at('hook', 5.4) + i * 0.07, { dur: 0.45, dy: 26 }))
    const k = ease(ramp(t, at('hook', 7.6), at('hook', 8.4)))
    $('hook-head').style.transform = `translateY(${-178 * k}px) scale(${lerp(1, 0.6, k)})`
    for (const st of STATS) {
      const t0 = at('hook', st.at)
      const kk = easeOut(ramp(t, t0, t0 + 0.55))
      st.el.style.opacity = kk
      st.el.style.transform = `translateY(${lerp(46, 0, kk)}px)`
      const v = st.value * easeOut(ramp(t, t0 + 0.1, t0 + 1.3))
      st.num.textContent = v.toFixed(st.dec) + '%'
    }
  }
  /* big skyline: hook + intro, again for the close */
  const skyIn = (t0) => (b, i) => { const k = backOut(ramp(t, t0 + i * 0.07, t0 + i * 0.07 + 0.55)); b.style.transform = `scaleY(${Math.max(0, k)})` }
  const skyOut = ease(ramp(t, at('intro', 10.2), at('intro', 10.9)))
  const closeSky = t >= at('close', 0)
  if (closeSky) bigBuildings.forEach(skyIn(at('close', 0.1)))
  else bigBuildings.forEach(skyIn(at('hook', 0)))
  $('bigsky').style.opacity = closeSky ? 0.5 * ease(ramp(t, at('close', 0), at('close', 0.4))) : 0.5 * (1 - skyOut)
  show($('bigsky'), closeSky || t < at('intro', 11))

  /* intro: logo lock-up flies into the top bar */
  const introOn = t >= at('intro', 0) && t < at('intro', 11.2)
  show($('s-intro'), introOn)
  if (introOn) {
    const out = ease(ramp(t, at('intro', 10.0), at('intro', 10.6)))
    enter($('intro-tag'), t, at('intro', 0.9), { dur: 0.5, dy: 18 })
    $('intro-tag').style.opacity *= 1 - out
    prEls.forEach((e, i) => { const k = enter(e, t, at('intro', PRINCIPLES[i][2]), { dur: 0.45, dy: 22 }); e.style.opacity = k * (1 - out); e.style.transform += ` scale(${lerp(0.94, 1, easeOut(ramp(t, at('intro', PRINCIPLES[i][2]), at('intro', PRINCIPLES[i][2] + 0.45))))})` })
  }
  const heroOn = HERO && t >= at('intro', 0) && t < SC.intro.end
  show($('hero'), heroOn)
  if (heroOn) {
    const kin = easeOut(ramp(t, at('intro', 0.3), at('intro', 1.0)))
    const fly = ease(ramp(t, at('intro', 10.2), SC.intro.end - 0.05))
    const sc = lerp(lerp(0.92, 1, kin), 0.2, fly)
    const cx = lerp(HERO.x0 + (HERO.w * (1 - sc)) / 2, HERO.x1, fly)
    const cy = lerp(HERO.y0 + (HERO.h * (1 - sc)) / 2 + 20 * (1 - kin), HERO.y1, fly)
    $('hero').style.opacity = kin
    $('hero').style.transform = `translate(${cx}px, ${cy}px) scale(${sc})`
  }

  /* how it's built */
  const stackOn = t >= at('stack', 0.2) && t < at('close', 0.8)
  show($('s-stack'), stackOn)
  if (stackOn) {
    const out = ease(ramp(t, at('close', 0), at('close', 0.6)))
    $('s-stack').style.opacity = 1 - out
    enter($('s-stack').querySelector('.hd'), t, at('stack', 0.4), { dur: 0.5 })
    enter($('cA'), t, at('stack', 0.9), { dur: 0.5, dy: 30 })
    rowsA.forEach((r, i) => {
      const k = easeOut(ramp(t, at('stack', 1.3 + i * 0.12), at('stack', 1.7 + i * 0.12)))
      r.style.opacity = k; r.style.transform = `translateX(${lerp(-14, 0, k)}px)`
      const hi = i === 0 ? ramp(t, at('stack', 3.2), at('stack', 3.5)) * (1 - ramp(t, at('stack', 6.6), at('stack', 6.9))) : 0
      r.style.background = hi > 0.5 ? 'var(--tint)' : 'var(--mist)'
      r.style.borderColor = hi > 0.5 ? 'var(--soft)' : 'transparent'
      r.style.color = hi > 0.5 ? 'var(--brand-deep)' : 'var(--ink-soft)'
    })
    enter($('cB'), t, at('stack', 6.0), { dur: 0.45, dy: 24 })
    enter($('cB2'), t, at('stack', 6.4), { dur: 0.45, dy: 24 })
    enter($('cC1'), t, at('stack', 7.4), { dur: 0.5, dy: 30 })
    enter($('cC2'), t, at('stack', 10.8), { dur: 0.5, dy: 30 })
    for (const wr of stackWires) wr.el.setAttribute('stroke-dashoffset', String(wr.len * (1 - ease(ramp(t, at('stack', wr.at), at('stack', wr.at + 0.6))))))
    // data flowing browser → data layer → Tandem Live
    const flowOn = ramp(t, at('stack', 8.2), at('stack', 8.5))
    sparks.forEach((sp, i) => {
      const u = (((t - at('stack', 8.2)) / 1.8 + i / 3) % 1 + 1) % 1
      const [a, b2] = [stackWires[0], stackWires[1]]
      const uu = u < 0.5 ? u * 2 : (u - 0.5) * 2
      const p = bez(u < 0.5 ? a.pts : b2.pts, uu)
      sp.style.left = p[0] + 'px'; sp.style.top = p[1] + 'px'
      sp.style.opacity = flowOn * clamp01(Math.sin(uu * Math.PI) * 4)
    })
    proofEls.forEach((e, i) => { enter(e, t, at('stack', PROOF[i][2]), { dur: 0.45, dy: 20 }); e.style.transform += ` scale(${lerp(0.9, 1, backOut(ramp(t, at('stack', PROOF[i][2]), at('stack', PROOF[i][2] + 0.45))))})` })
  }

  /* close */
  const closeOn = t >= at('close', 0.2)
  show($('s-close'), closeOn)
  if (closeOn) {
    enter($('close-lock'), t, at('close', 0.3), { dur: 0.6, dy: 30 })
    cl1.forEach((w, i) => enter(w, t, at('close', 0.5) + i * 0.06, { dur: 0.4, dy: 20 }))
    cl2.forEach((w, i) => enter(w, t, at('close', 3.9) + i * 0.06, { dur: 0.4, dy: 20 }))
    enter($('team'), t, at('close', 5.0), { dur: 0.5, dy: 16 })
  }
}

function seekDevices(t, dm) {
  const on = dm > 0.001
  for (const id of ['phone', 'node', 'wires', 'lab-laptop', 'lab-phone', 'pkts', 'latency']) show($(id), on)
  if (!on) return
  const kPhone = ease(ramp(dm, 0.25, 1))
  $('phone').style.opacity = kPhone
  $('phone').style.transform = `translateX(${lerp(460, 0, kPhone)}px)`
  const kNode = ease(ramp(dm, 0.55, 1))
  const offline = t >= OFFLINE[0] && t < OFFLINE[1]
  const pulse = PULSES.reduce((m, p) => (t >= p ? Math.max(m, 1 - ramp(t, p, p + 0.35)) : m), 0)
  $('node').style.opacity = kNode
  $('node').style.transform = `translate(-50%, -50%) scale(${lerp(0.9, 1, kNode) + 0.06 * pulse})`
  $('node').style.borderColor = offline ? 'var(--line-strong)' : pulse > 0 ? 'var(--brand)' : 'var(--line)'
  $('nic').style.background = offline ? 'var(--mist)' : 'var(--tint)'
  $('nic').style.color = offline ? 'var(--muted)' : 'var(--brand)'
  $('nic').innerHTML = icon(offline ? 'wifi-off' : 'container', 28, 2)
  $('ndot').style.background = offline ? '#9aa0a6' : '#1e8e3e'
  $('nst').style.background = offline ? 'var(--mist)' : 'var(--success-tint)'
  $('nst').style.color = offline ? 'var(--muted)' : 'var(--success)'
  $('ntext').textContent = offline ? 'Server offline' : 'Online · 2 devices'
  for (const id of ['w1', 'w2']) {
    const l = $(id)
    l.setAttribute('stroke', offline ? '#c4c7cc' : '#e8a0ad')
    l.setAttribute('stroke-dasharray', offline ? '6 9' : '10 8')
    l.setAttribute('stroke-dashoffset', offline ? '0' : String(-t * 40))
  }
  $('wires').style.opacity = kNode
  $('lab-laptop').style.opacity = ease(ramp(dm, 0.6, 1))
  $('lab-phone').style.opacity = kPhone
  $('latency').style.opacity = kNode * ramp(t, at('chat', 12.0), at('chat', 12.4)) * (1 - ramp(t, OFFLINE[0], OFFLINE[0] + 0.3))
  // phone screen
  for (const p of PHONE) {
    const next = PHONE[PHONE.indexOf(p) + 1]
    const vis = t >= p.in && (!next || t < next.in + next.fd + 0.02)
    p.el.style.display = vis ? 'block' : 'none'
    if (vis) p.el.style.opacity = p.fd ? ease(ramp(t, p.in, p.in + p.fd)) : 1
  }
  for (const r of PRINGS) {
    const vis = t >= r.from && t < r.to
    r.el.style.display = vis ? 'block' : 'none'; r.lab.style.display = vis ? 'flex' : 'none'
    if (!vis) continue
    const k = easeOut(ramp(t, r.from, r.from + 0.2)) * (1 - ease(ramp(t, r.to - 0.16, r.to)))
    const pad = 5, [x, y, w, h] = r.rect.map((v) => v * PS)
    Object.assign(r.el.style, { left: (x - pad) + 'px', top: (y - pad) + 'px', width: (w + 2 * pad) + 'px', height: (h + 2 * pad) + 'px', opacity: k })
    const [lx, ly] = placeLabel(r.lab, x - pad, y - pad, w + 2 * pad, h + 2 * pad, 'top', 351, 760)
    Object.assign(r.lab.style, { left: lx + 'px', top: ly + 'px', opacity: k })
  }
  for (const tp of PTAPS) {
    const k = ramp(t, tp.t - 0.05, tp.t + 0.4)
    tp.el.style.display = k > 0 && k < 1 ? 'block' : 'none'
    tp.el.style.left = tp.x * PS + 'px'; tp.el.style.top = tp.y * PS + 'px'
    tp.el.style.opacity = 1 - k; tp.el.style.transform = `scale(${lerp(0.6, 1.3, easeOut(k))})`
  }
  for (const pk of PACKETS) {
    const end = pk.hold ?? pk.t1
    const vis = t >= pk.t0 && t < end
    pk.el.style.display = vis ? 'block' : 'none'
    if (!vis) continue
    const k = ease(ramp(t, pk.t0, pk.t1))
    pk.el.style.left = lerp(pk.x0, pk.x1, k) + 'px'
    pk.el.style.top = WY + 'px'
    pk.el.style.opacity = pk.hold && t > pk.t1 ? 0.55 + 0.45 * Math.abs(Math.sin((t - pk.t1) * 4)) : 1
  }
}

function seek(t) {
  seekSlides(t)
  const dm = dmAt(t)

  /* demo chrome: in at the end of the intro, out at the start of "how it's built" */
  const kin = easeOut(ramp(t, at('intro', 10.5), SC.intro.end + 0.3))
  const kout = ease(ramp(t, at('stack', 0), at('stack', 0.7)))
  const demoOn = kin > 0 && kout < 1
  for (const id of ['browser', 'panel', 'topbar']) show($(id), demoOn)
  $('skyline').style.opacity = 0.55 * kin * (1 - kout)
  if (demoOn) {
    const vis = kin * (1 - kout)
    $('topbar').style.opacity = 1 - kout
    $('brand').style.opacity = t >= SC.intro.end - 0.05 ? 1 : 0
    $('pills').style.opacity = ease(ramp(t, at('signup', 0), at('signup', 0.5)))
    const s0 = lerp(0.985, 1, kin) - 0.02 * kout
    const s = s0 * (1 - 0.2 * dm)
    const ty = lerp(30, 0, kin) + 87.6 * dm
    // scale about the frame's centre while entering, about its top-left in device mode
    const ox = 664 * (1 - s0), oy = 438 * (1 - s0)
    $('browser').style.opacity = vis
    $('browser').style.transform = `translate(${ox}px, ${oy + ty}px) scale(${s})`
    $('panel').style.opacity = vis * (1 - ease(ramp(dm, 0, 0.5)))
    const pe = easeOut(ramp(t, at('signup', 0.6), at('signup', 1.1)))
    $('persona').style.opacity = pe
    $('persona').style.transform = `translateY(${lerp(18, 0, pe)}px)`
  }

  /* step pills */
  STEPS.forEach((s, i) => {
    const p = pillEls[i]
    const active = t >= s.from && t < s.to
    const done = t >= s.to
    const k = ease(ramp(t, s.from, s.from + 0.25))
    if (active) { p.style.background = `rgb(${lerp(255, 200, k)} ${lerp(255, 16, k)} ${lerp(255, 46, k)})`; p.style.color = k > 0.5 ? '#fff' : 'var(--muted)'; p.style.borderColor = 'transparent'; p.style.transform = `scale(${lerp(1, 1.06, k)})` }
    else if (done) { p.style.background = 'var(--tint)'; p.style.color = 'var(--brand-deep)'; p.style.borderColor = 'var(--soft)'; p.style.transform = 'scale(1)' }
    else { p.style.background = '#fff'; p.style.color = 'var(--muted)'; p.style.borderColor = 'var(--line)'; p.style.transform = 'scale(1)' }
    p.firstChild.innerHTML = done ? icon('check', 16, 3) : ''
  })

  seekDevices(t, dm)
  if (!demoOn) return

  /* camera + shots */
  const c = camAt(t)
  cam.style.transform = `translate(${(VW * S) / 2 - c.cx * c.z * S}px, ${(VH * S) / 2 - c.cy * c.z * S}px) scale(${c.z * S})`
  let top = null
  for (const s of SHOTS) {
    const visible = t >= s.in && t < s.out
    s.el.style.display = visible ? 'block' : 'none'
    if (!visible) continue
    top = s
    s.el.style.opacity = s.fd ? ease(ramp(t, s.in, s.in + s.fd)) : 1
    if (s.xf) {
      const [sc, ox, oy] = track(s.xf.map(([tt, ...v]) => [tt, v]), t)
      s.el.style.transform = `translate(${ox}px, ${oy}px) scale(${sc}) translate(${-ox}px, ${-oy}px)`
    }
    const y = scrollOf(s, t)
    s.page.style.transform = `translateY(${-y}px)`
    if (s.hdr) s.hdr.style.display = y > 1 ? 'block' : 'none'
    for (const p of s.patches ?? []) {
      const k = ramp(t, p.at, p.at + p.dur)
      if (k <= 0) { p.el.style.display = 'none'; continue }
      p.el.style.display = 'block'
      if (p.kind === 'circle') {
        p.el.style.clipPath = `circle(${p.r * backOut(k)}px at ${p.c[0]}px ${p.c[1]}px)`
        p.el.style.opacity = 1
      } else {
        const [x, yy, w, hh] = p.rect
        const ww = p.kind === 'wipe' ? w * ease(k) : w
        p.el.style.clipPath = `inset(${yy}px ${1280 - x - ww}px ${s.h - yy - hh}px ${x}px round 8px)`
        p.el.style.opacity = p.kind === 'wipe' ? 1 : ease(k)
        if (p.kind === 'pop') {
          const e = backOut(k)
          p.el.style.transformOrigin = `${p.origin[0]}px ${p.origin[1]}px`
          p.el.style.transform = `scale(${lerp(0.82, 1, e)})`
        }
      }
    }
    if (s.typing) {
      const ty = s.typing
      const on = t >= ty.caret[0] && t < ty.caret[1]
      ty.el.style.display = on ? 'flex' : 'none'
      const n = Math.round(ty.text.length * ramp(t, ty.from, ty.to))
      ty.txt.textContent = ty.text.slice(0, n)
      ty.car.style.opacity = t < ty.to ? 1 : Math.floor(t * 3.2) % 2 === 0 ? 1 : 0
    }
  }
  if (top) $('url').innerHTML = `${icon('globe', 15, 2)}<span>localhost:5173<b>${top.url}</b></span>`

  /* rings */
  for (const r of RINGS) {
    const s = shotById[r.shot]
    const vis = t >= r.from && t < r.to && t >= s.in && t < s.out
    r.el.style.display = vis ? 'block' : 'none'
    r.lab.style.display = vis ? 'flex' : 'none'
    if (!vis) continue
    const k = easeOut(ramp(t, r.from, r.from + 0.2)) * (1 - ease(ramp(t, r.to - 0.16, r.to)))
    const y = scrollOf(s, t)
    const pad = 7
    const [x0, y0] = toScreen(c, r.rect[0] - pad, r.rect[1] - y - pad)
    const [x1, y1] = toScreen(c, r.rect[0] + r.rect[2] + pad, r.rect[1] + r.rect[3] - y + pad)
    const grow = lerp(1.08, 1, easeOut(ramp(t, r.from, r.from + 0.25)))
    Object.assign(r.el.style, { left: x0 + 'px', top: y0 + 'px', width: (x1 - x0) + 'px', height: (y1 - y0) + 'px', opacity: k, transform: `scale(${grow})` })
    const [lx, ly] = placeLabel(r.lab, x0, y0, x1 - x0, y1 - y0, r.pos)
    Object.assign(r.lab.style, { left: lx + 'px', top: ly + 'px', opacity: k, transform: `translateY(${lerp(8, 0, easeOut(ramp(t, r.from + 0.05, r.from + 0.3)))}px)` })
  }

  /* cursor */
  let cpos = null, cop = 0
  for (const sg of CURSOR) {
    if (t < sg.from || t > sg.to) continue
    const s = shotById[sg.shot]
    const kv = sg.kf.map(([tt, x, yy]) => [tt, [x, yy - scrollOf(s, tt)]])
    const [vx, vy] = track(kv, t)
    cpos = toScreen(c, vx, vy)
    cop = ramp(t, sg.from, sg.from + 0.15) * (1 - ramp(t, sg.to - 0.15, sg.to))
  }
  cursor.style.display = cpos ? 'block' : 'none'
  if (cpos) {
    const press = CLICKS.some((ct) => t >= ct - 0.05 && t < ct + 0.1) ? 0.86 : 1
    cursor.style.opacity = cop
    cursor.style.transform = `translate(${cpos[0] - 6}px, ${cpos[1] - 3.5}px) scale(${press})`
  }
  CLICKS.forEach((ct, i) => {
    const k = ramp(t, ct, ct + 0.45)
    const e = ripples[i]
    if (k <= 0 || k >= 1 || !cpos) { e.style.display = 'none'; return }
    e.style.display = 'block'
    e.style.left = cpos[0] + 'px'; e.style.top = cpos[1] + 'px'
    e.style.opacity = 0.9 * (1 - k)
    e.style.transform = `scale(${lerp(0.2, 1, easeOut(k))})`
  })

  /* display-mode toasts */
  for (const m of MODES) {
    const vis = t >= m.from && t < m.to
    m.el.style.display = vis ? 'flex' : 'none'
    if (!vis) continue
    const k = easeOut(ramp(t, m.from, m.from + 0.22)) * (1 - ease(ramp(t, m.to - 0.15, m.to)))
    m.el.style.opacity = k
    m.el.style.transform = `translateX(-50%) translateY(${lerp(16, 0, k)}px)`
  }

  /* read-aloud waves */
  const wv = t >= waveRing.from + 0.1 && t < waveRing.to
  waves.style.display = wv ? 'block' : 'none'
  if (wv) {
    const s = shotById[waveRing.shot]
    const [wx, wy] = toScreen(c, waveRing.rect[0] + waveRing.rect[2] + 4, waveRing.rect[1] + waveRing.rect[3] / 2 - scrollOf(s, t))
    waves.style.left = wx + 'px'; waves.style.top = (wy - 30) + 'px'
    waves.style.opacity = ease(ramp(t, waveRing.from + 0.1, waveRing.from + 0.35)) * (1 - ease(ramp(t, waveRing.to - 0.16, waveRing.to)))
    wavePaths.forEach((p, i) => { p.style.opacity = 0.2 + 0.8 * Math.max(0, Math.sin((t * 2.6 - i * 0.22) * Math.PI)) })
  }

  /* side panel */
  for (const p of PANELS) {
    const vis = t >= p.from - 0.01 && t < p.to
    p.el.style.display = vis ? 'block' : 'none'
    if (!vis) continue
    const kin2 = easeOut(ramp(t, p.from, p.from + 0.38))
    const kout2 = ease(ramp(t, p.to - 0.22, p.to))
    p.el.style.opacity = kin2 * (1 - kout2)
    p.el.style.transform = `translateY(${lerp(22, 0, kin2) - 12 * kout2}px)`
    p.chipEls.forEach((ch, i) => { const k = easeOut(ramp(t, p.from + 0.18 + i * 0.08, p.from + 0.45 + i * 0.08)); ch.style.opacity = k; ch.style.transform = `translateX(${lerp(-14, 0, k)}px)` })
    p.audEls.forEach((ch, i) => { const k = backOut(ramp(t, p.from + 0.35 + i * 0.1, p.from + 0.65 + i * 0.1)); ch.style.opacity = clamp01(k); ch.style.transform = `scale(${lerp(0.7, 1, Math.min(k, 1.05))})` })
  }
}
window.seek = seek
window.DURATION = DURATION

Promise.all([...images].map((img) => (img.decode ? img.decode().catch(() => {}) : null)).concat([document.fonts.ready])).then(() => {
  // lay out hidden slides once so they can be measured
  for (const id of ['s-stack', 'hero']) $(id).style.display = ''
  measure()
  seek(0)
  window.READY = true
  if (new URLSearchParams(location.search).has('play')) {
    const t0 = performance.now()
    const loop = () => { const t = ((performance.now() - t0) / 1000) % (DURATION + 1); seek(Math.min(t, DURATION)); requestAnimationFrame(loop) }
    loop()
  }
  const q = new URLSearchParams(location.search).get('t')
  if (q) seek(Number(q))
})
</script>
